name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java (Spring Boot, Spring Modulith)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Uses the in-memory token ledger: no Docker or Besu node required.
      - run: mvn -B verify

  contracts:
    name: Solidity (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
      - run: ./install-deps.sh
      - run: forge build
      - run: forge test -vv
