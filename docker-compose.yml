# Three local Besu nodes, three separate chains run by three different operators (permissioned QBFT networks
# with 1 validator, 1 s blocks):
# - besu: Eurosystem DLT (cash tokens), chainId 1337, port 8545;
# - besu-market-a / besu-market-b: two market DLT platforms (ERC-3643 securities and Hash-Link Contracts),
#   chainId 1338 / 1339, ports 8546 / 8547.
x-besu-node: &besu-node
  image: hyperledger/besu:26.9.0
  command:
    - --genesis-file=/besu/genesis.json
    - --node-private-key-file=/besu/validator/key
    - --data-path=/tmp/besu-data
    - --min-gas-price=0
    - --rpc-http-enabled
    - --rpc-http-host=0.0.0.0
    - --rpc-http-port=8545
    - --rpc-http-api=ETH,NET,WEB3,QBFT,TXPOOL
    - --rpc-http-cors-origins=*
    - --host-allowlist=*
    - --profile=ENTERPRISE
    - --revert-reason-enabled
  healthcheck:
    # The Besu image ships neither curl nor wget: HTTP request via bash's /dev/tcp to the native /liveness endpoint.
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8545 && printf 'GET /liveness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
    interval: 5s
    timeout: 3s
    retries: 20

services:
  besu:
    <<: *besu-node
    container_name: pontes-besu
    volumes:
      - ./besu:/besu:ro
    ports:
      - "8545:8545"

  besu-market-a:
    <<: *besu-node
    container_name: pontes-besu-market-a
    volumes:
      - ./besu-market-a:/besu:ro
    ports:
      - "8546:8545"

  besu-market-b:
    <<: *besu-node
    container_name: pontes-besu-market-b
    volumes:
      - ./besu-market-b:/besu:ro
    ports:
      - "8547:8545"
